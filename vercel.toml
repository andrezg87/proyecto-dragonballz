# vercel.toml — Configuración de Vercel para este proyecto (con comentarios).
#
# Vercel necesita contestar 3 preguntas para publicar tu página:
#   1) ¿Qué instalo?   2) ¿Qué ejecuto para construirla?   3) ¿Qué carpeta publico?
# Aquí están las tres respuestas. Es el único archivo de configuración de Vercel del repositorio.

# Ayuda al editor (VS Code) a autocompletar y a avisarte si escribes algo mal.
# No cambia nada del despliegue. Déjalo igual.
"$schema" = "https://openapi.vercel.sh/vercel.json"

# (No hay línea "framework": esta página no usa ningún framework como Next.js o Vite.
#  Es HTML + CSS + TypeScript a secas, así que Vercel no aplica ajustes automáticos.)

# PREGUNTA 1 · ¿QUÉ INSTALO?
# Descarga las dependencias del proyecto (aquí, TypeScript) leyendo los package.json.
# Es el mismo comando que ejecutaste en tu computador la primera vez.
installCommand = "npm install"

# PREGUNTA 2 · ¿QUÉ EJECUTO PARA CONSTRUIR LA PÁGINA?
# Es un script del package.json de la raíz del repositorio: compila los main.ts de TUS niveles (04-proyecto/dragonball/nivelN) a main.js.
# Los navegadores no entienden TypeScript: este paso crea el main.js que sí cargan.
buildCommand = "npm run build"

# PREGUNTA 3 · ¿QUÉ CARPETA PUBLICO?
# Vercel sube SOLO esta carpeta a internet (su index.html es lo que ve el visitante).
# Debe existir DESPUÉS de construir. Si no existe, Vercel falla con:
#   «No Output Directory named "public" found after the Build completed»
outputDirectory = "04-proyecto/dragonball/nivel7"
