<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dragon Ball Explorer</title>
</head>
<body>

  <header>
    <h1>Dragon Ball Explorer</h1>
    <nav>
      <a href="#" aria-current="page">Personajes</a>
      <a href="#">Planetas</a>
    </nav>
  </header>

  <main>
    <h2>¡Elige a tu guerrero!</h2>
    <p>Busca a tus personajes favoritos y mira cuánto ki tienen.</p>

        <section aria-label="Buscar y filtrar personajes">
      <label for="buscador">Buscar personaje</label>
      <input type="search" id="buscador" placeholder="Busca por nombre… ej. Goku">

      <div role="group" aria-label="Filtrar por raza">
        <button type="button" aria-pressed="true">Todos</button>
        <button type="button" aria-pressed="false">Saiyan</button>
        <button type="button" aria-pressed="false">Namekian</button>
        <button type="button" aria-pressed="false">Human</button>
        <button type="button" aria-pressed="false">Android</button>
      </div>

      <label for="afiliacion">Afiliación</label>
      <select id="afiliacion">
        <option value="">Todas las afiliaciones</option>
        <option value="Z Fighter">Z Fighter</option>
        <option value="Army of Frieza">Army of Frieza</option>
        <option value="Villain">Villain</option>
        <option value="Other">Other</option>
      </select>
    </section>
    
    <section aria-label="Lista de personajes">
      <article>
        <img src="https://dragonball-api.com/characters/goku_normal.webp"
             alt="Goku" width="150">
        <h3>Goku</h3>
        <p>Saiyan</p>
        <p>Ki: 60.000.000</p>
      </article>

      <!-- Pieza 4: las otras 4 tarjetas -->
    </section>
  </main>

</body>
</html>
