<!DOCTYPE html>
<!--
  PASO 7 · El remate: buscador, 251 pokémon, carruseles y animaciones
  Objetivo: usar todo lo aprendido y subirlo de nivel.
    - Buscador por nombre o número + filtro por tipo
    - Los 251 pokémon de Kanto y Johto, cargados por lotes con barra de progreso
    - Un carrusel de imágenes dentro de CADA tarjeta (arte oficial, brillante, animado...)
    - Carrusel automático de legendarios
    - Ventana de detalle con estadísticas
    - Animaciones al pasar el mouse
  El HTML es solo el "esqueleto": casi todo se dibuja desde main.ts.
-->
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokédex 251 · Paso 7</title>

  <!-- Tailwind por CDN (igual que en el paso 6) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- NUEVO: extendemos Tailwind con nuestras propias animaciones.
       Aquí definimos los @keyframes y les damos un nombre de clase: animate-flotar, animate-aparecer... -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          keyframes: {
            flotar:   { "0%, 100%": { transform: "translateY(0)" }, "50%": { transform: "translateY(-8px)" } },
            aparecer: { from: { opacity: "0", transform: "translateY(16px) scale(.97)" }, to: { opacity: "1", transform: "none" } },
            brillo:   { "0%": { backgroundPosition: "0% 50%" }, "100%": { backgroundPosition: "200% 50%" } },
          },
          animation: {
            flotar: "flotar 2.4s ease-in-out infinite",
            aparecer: "aparecer .45s ease-out both",
            brillo: "brillo 6s linear infinite",
          },
        },
      },
    };
  </script>

  <!-- Unas pocas reglas que Tailwind no trae listas: ocultar la barra de scroll de los carruseles
       y el resplandor de cada tarjeta, que usa una variable CSS (--glow) con el color del tipo. -->
  <style>
    .carrusel { scrollbar-width: none; scroll-behavior: smooth; }
    .carrusel::-webkit-scrollbar { display: none; }
    .tarjeta:hover { box-shadow: 0 18px 40px -12px var(--glow); }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
    }
  </style>
</head>

<body class="min-h-screen bg-slate-950 font-sans text-slate-100 antialiased">
  <!-- ===== HÉROE: título y buscador ===== -->
  <header class="relative overflow-hidden px-4 pb-8 pt-10 text-center">
    <!-- Decoración: círculos borrosos de fondo (pointer-events-none = no estorban los clics) -->
    <div class="pointer-events-none absolute -left-24 -top-24 h-72 w-72 rounded-full bg-orange-500/20 blur-3xl"></div>
    <div class="pointer-events-none absolute -right-24 top-10 h-72 w-72 rounded-full bg-sky-500/20 blur-3xl"></div>

    <!-- Texto con degradado animado: bg-clip-text recorta el fondo a la forma de las letras -->
    <h1 class="relative bg-gradient-to-r from-orange-400 via-pink-500 to-sky-400 bg-[length:200%_100%] bg-clip-text text-4xl font-extrabold text-transparent animate-brillo sm:text-6xl">
      Pokédex 251
    </h1>
    <p class="relative mt-2 text-slate-400">Kanto y Johto · buscador, carruseles y datos en vivo desde PokéAPI</p>

    <!-- Buscador: el id "buscar" lo usa main.ts -->
    <div class="relative mx-auto mt-6 max-w-xl">
      <label for="buscar" class="sr-only">Buscar pokémon</label>
      <input id="buscar" type="search" autocomplete="off" placeholder="Busca por nombre o número… (pulsa / para enfocar)"
        class="w-full rounded-full border border-slate-700 bg-slate-900/80 px-6 py-3.5 text-base text-white shadow-lg outline-none backdrop-blur transition placeholder:text-slate-500 focus:border-orange-400 focus:ring-4 focus:ring-orange-400/20">
    </div>
  </header>

  <main class="mx-auto max-w-7xl px-4 pb-16">
    <!-- ===== CARRUSEL AUTOMÁTICO: legendarios ===== -->
    <section aria-labelledby="t-legendarios" class="mb-8">
      <h2 id="t-legendarios" class="mb-3 text-sm font-semibold uppercase tracking-widest text-slate-400">Legendarios</h2>
      <!-- snap-x + snap-mandatory: al deslizar, el scroll "se pega" a cada elemento -->
      <div id="destacados" class="carrusel flex snap-x snap-mandatory gap-4 overflow-x-auto pb-2"></div>
    </section>

    <!-- ===== FILTROS POR TIPO (se dibujan desde main.ts) ===== -->
    <section aria-label="Filtrar por tipo" class="mb-4">
      <div id="filtros" class="carrusel flex gap-2 overflow-x-auto pb-2"></div>
    </section>

    <!-- ===== BARRA DE PROGRESO + MENSAJES ===== -->
    <div class="mb-6">
      <div id="progreso-caja" class="mb-2 h-1.5 overflow-hidden rounded-full bg-slate-800">
        <div id="progreso" class="h-full w-0 rounded-full bg-gradient-to-r from-orange-400 to-pink-500 transition-all duration-300"></div>
      </div>
      <p id="estado" class="min-h-6 text-center text-sm text-slate-400" aria-live="polite"></p>
      <div class="text-center">
        <button id="reintentar" hidden class="mt-2 rounded-full bg-red-500 px-5 py-2 text-sm font-semibold text-white transition hover:bg-red-400">Reintentar</button>
      </div>
    </div>

    <!-- ===== GRILLA DE TARJETAS ===== -->
    <section id="lista" class="grid grid-cols-1 gap-5 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4"></section>

    <!-- Mensaje cuando la búsqueda no encuentra nada -->
    <p id="vacio" hidden class="py-16 text-center text-lg text-slate-400">No encontré ningún pokémon con esa búsqueda.</p>

    <div class="mt-8 text-center">
      <button id="mas" hidden class="rounded-full border border-slate-700 bg-slate-900 px-8 py-3 font-semibold text-slate-100 transition hover:-translate-y-0.5 hover:border-orange-400 hover:text-orange-300">Mostrar más</button>
    </div>
  </main>

  <!-- ===== VENTANA DE DETALLE =====
       <dialog> es una etiqueta nativa: showModal() la abre encima de todo, Esc la cierra
       y ::backdrop es el fondo oscuro. Sin librerías. -->
  <dialog id="detalle" class="m-auto w-[min(92vw,42rem)] max-h-[92vh] overflow-hidden rounded-3xl border border-slate-700 bg-slate-900 p-0 text-slate-100 shadow-2xl backdrop:bg-black/70 backdrop:backdrop-blur-sm open:animate-aparecer"></dialog>

  <script src="main.js"></script>
</body>
</html>
